name: Build and account lifecycle
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: household_planner_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d household_planner_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
    env:
      TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/household_planner_test
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
      DB_URL: jdbc:postgresql://127.0.0.1:5432/household_planner_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      APP_PUBLIC_URL: http://127.0.0.1:5173
      ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      COOKIE_SECURE: "false"
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      MAIL_FROM: Household Planner <noreply@example.test>
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --prefix web
      - name: Frontend component and client tests
        run: npm run test:unit --prefix web
      - name: Frontend production build
        run: npm run build --prefix web
      - name: Scala security and isolated PostgreSQL integration tests
        run: sbt "backend/test"
      - name: Migrate E2E database
        run: >-
          docker run --rm --network host
          -v "$PWD/backend/src/main/resources/db/migration:/flyway/sql:ro"
          flyway/flyway:13.7.0
          -url="$DB_URL" -user="$DB_USER" -password="$DB_PASSWORD" migrate
      - name: Start backend
        shell: bash
        run: |
          ./scripts/generate-jwt-keys.sh
          export JWT_PRIVATE_KEY_FILE="$PWD/.local/secrets/jwt-private.pem"
          export JWT_PUBLIC_KEY_FILE="$PWD/.local/secrets/jwt-public.pem"
          sbt "backend/run" > .local/api.log 2>&1 &
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8080/api/ready; then exit 0; fi
            sleep 1
          done
          cat .local/api.log
          exit 1
      - name: Install Chromium
        run: cd web && npx playwright install --with-deps chromium
      - name: Browser account lifecycle
        run: npm run test:e2e --prefix web
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: account-lifecycle-failure
          path: |
            web/playwright-report/
            web/test-results/
            .local/api.log
          retention-days: 7
