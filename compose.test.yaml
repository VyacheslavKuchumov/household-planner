# Disposable test stack. It never mounts development or production database volumes.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: household_planner_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5544:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "household_planner_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"
  migrate:
    image: flyway/flyway:13.7.0
    command: ["-url=jdbc:postgresql://db:5432/household_planner_test", "-user=postgres", "-password=postgres", "migrate"]
    volumes:
      - ./backend/src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/household_planner_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      APP_PUBLIC_URL: http://127.0.0.1:5173
      ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      COOKIE_SECURE: "false"
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      MAIL_FROM: Household Planner <noreply@example.test>
    secrets:
      - jwt_private
      - jwt_public
    tmpfs:
      - /run/household
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/ready"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
secrets:
  jwt_private:
    file: ./.local/secrets/jwt-private.pem
  jwt_public:
    file: ./.local/secrets/jwt-public.pem
